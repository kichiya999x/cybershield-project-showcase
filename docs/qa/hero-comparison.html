<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CyberShield hero comparison</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 36px;
        background: #08192d;
        color: #f6fbff;
        font-family: "Segoe UI", Arial, sans-serif;
      }
      h1 { margin: 0 0 8px; font-size: 28px; }
      .lede { margin: 0 0 28px; color: #a9bfd4; }
      .references {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        margin-bottom: 24px;
      }
      figure {
        margin: 0;
        overflow: hidden;
        border: 1px solid #35516f;
        background: #102844;
      }
      figcaption {
        padding: 12px 16px;
        color: #dceaf7;
        font-size: 14px;
        letter-spacing: 0.04em;
      }
      .references img {
        width: 100%;
        height: 300px;
        display: block;
        object-fit: contain;
        background: #fff;
      }
      .result img {
        width: 100%;
        height: 790px;
        display: block;
        object-fit: contain;
        object-position: top;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <h1>CyberShield hero redesign — visual QA board</h1>
    <p class="lede">Reference hierarchy and institutional poster atmosphere compared with the browser-rendered implementation.</p>
    <section class="references">
      <figure>
        <figcaption>Reference A · previous hero structure</figcaption>
        <img src="reference-current-hero.png" alt="Previous CyberShield hero" />
      </figure>
      <figure>
        <figcaption>Reference B · CyberShield poster art direction</figcaption>
        <img src="reference-poster.png" alt="CyberShield poster reference" />
      </figure>
    </section>
    <figure class="result">
      <figcaption>Implementation · Edge · 1440 × 900 CSS pixels</figcaption>
      <img src="hero-desktop-1440x900.png" alt="Implemented CyberShield hero" />
    </figure>
  </body>
</html>
